# Dùng bởi job `codeql` trong .github/workflows/security.yml (chạy hằng tuần và
# chạy tay). Kiểm thử hằng ngày vẫn chạy qua git hook của husky; CodeQL chỉ quét
# định kỳ để bắt cảnh báo mới khi bộ query được cập nhật.

name: 'CodeQL config'

# Thư mục test chỉ chứa giá trị giả để khoá hành vi (mật khẩu, token, mã 2FA).
# Query hardcoded-credentials báo đúng cú pháp nhưng sai bản chất ở đây, nên loại
# trừ đường dẫn thay vì tắt query — code thật trong src/ vẫn được quét đầy đủ.
paths-ignore:
  - test
  - typings/*.test-d.ts
  - scripts/smoke

# Không tắt query nào. Nếu có cảnh báo trong src/ thì đó là cảnh báo cần đọc.
queries:
  - uses: security-and-quality
